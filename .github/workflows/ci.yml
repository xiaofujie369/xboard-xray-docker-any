name: sing-box checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh update.sh uninstall.sh sync/manage.sh
      - run: docker build -t xboard-singbox:test .
      - name: Extract tested core
        run: |
          container=$(docker create xboard-singbox:test)
          docker cp "$container:/usr/local/bin/sing-box" /tmp/sing-box
          docker rm "$container"
          chmod +x /tmp/sing-box
      - run: python tests/check_configs.py /tmp/sing-box
      - run: python tests/runtime_stats.py /tmp/sing-box
